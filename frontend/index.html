<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 비서 — 내 데이터를 아는 챗봇</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header>
    <h1><img src="favicon.png" alt="" width="28" height="28" class="logo"> AI 비서</h1>
    <div>
      <button id="export-btn" title="현재 데이터를 CSV로 내보내기">CSV 내보내기</button>
      <button id="theme-toggle" title="다크 모드 전환">다크 모드</button>
    </div>
  </header>

  <p class="waking" id="waking" role="status" hidden>
    서버를 깨우는 중입니다… 무료 서버라 한동안 아무도 안 쓰면 잠들어서, 첫 접속은 30초~1분 걸릴 수 있어요.
  </p>
  <p class="error" id="error" role="alert" hidden></p>

  <div class="summary-bar" id="summary-bar">
    <div class="summary-card"><div class="label">데이터 건수</div><div class="value" id="s-count">-</div></div>
    <div class="summary-card"><div class="label">기간</div><div class="value" id="s-period">-</div></div>
    <div class="summary-card"><div class="label">평균</div><div class="value" id="s-mean">-</div></div>
    <div class="summary-card"><div class="label">최고 / 최저</div><div class="value" id="s-maxmin">-</div></div>
    <div class="summary-card"><div class="label">표준편차</div><div class="value" id="s-stdev">-</div></div>
    <div class="summary-card"><div class="label">추세</div><div class="value" id="s-trend">-</div></div>
  </div>

  <section class="panel chart-panel">
    <div class="chart-head">
      <h2>추이 그래프</h2>
      <div class="range" role="group" aria-label="그래프 기간">
        <button type="button" data-days="30">30일</button>
        <button type="button" data-days="90" class="active">90일</button>
        <button type="button" data-days="0">전체</button>
      </div>
    </div>
    <svg id="chart" role="img" aria-label="데이터 값 추이 선 그래프"></svg>
  </section>

  <div class="grid">
    <div class="panel" id="conversations-panel">
      <h2>대화 기록</h2>
      <button id="new-chat-btn" type="button">+ 새 대화</button>
      <ul id="conversation-list"></ul>
      <p class="hint">대화를 클릭하면 이어서 대화할 수 있습니다.</p>
    </div>

    <div class="panel" id="chat-panel">
      <h2>채팅</h2>
      <div id="messages"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="내 데이터에 대해 물어보세요 (예: 요즘 추세가 어때? · 2026-09-02 값은?)" autocomplete="off" required>
        <button type="submit">보내기</button>
      </form>
    </div>

    <div class="panel" id="data-panel">
      <h2>데이터 관리</h2>
      <form id="data-form">
        <input id="data-date" type="date" required>
        <input id="data-value" type="number" step="any" placeholder="값" required>
        <input id="data-memo" type="text" maxlength="200" placeholder="메모 (선택)">
        <button type="submit">추가</button>
      </form>
      <ul id="data-list"></ul>
      <button id="data-more" type="button" class="more" hidden>더 보기</button>
      <p class="hint" id="data-count-hint"></p>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
