# Render Blueprint — 대시보드 New → Blueprint 에서 이 저장소를 고르면 아래대로 웹 서비스가 만들어진다.
# sync: false 인 값(키)은 만들 때 대시보드가 물어본다 — 이 파일엔 절대 값을 적지 않는다.
services:
  - type: web
    name: m12-ai-assistant-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
