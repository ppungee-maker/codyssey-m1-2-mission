name: ci

on:
  push:
    branches: [main]
  pull_request:

# PR 의 코드가 도는 작업이라 저장소 쓰기 권한을 주지 않는다
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: 백엔드 테스트
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest -q
      - name: 프론트엔드 문법 검사
        run: find frontend -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: 배포용 config.js 만들기 확인
        working-directory: frontend
        run: |
          API_BASE_URL=https://example.onrender.com/ node scripts/write-config.js
          grep -q '"https://example.onrender.com"' config.js
          node --check config.js
          ! API_BASE_URL= node scripts/write-config.js
